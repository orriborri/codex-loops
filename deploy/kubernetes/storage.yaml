apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codex-loops-state
  namespace: codex-loops
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: syno-storage
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codex-auth
  namespace: codex-loops-jobs
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: syno-storage
  resources:
    requests:
      storage: 1Gi
