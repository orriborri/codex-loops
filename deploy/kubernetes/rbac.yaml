apiVersion: v1
kind: ServiceAccount
metadata:
  name: codex-loops-controller
  namespace: codex-loops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codex-loops-job-manager
  namespace: codex-loops-jobs
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete, deletecollection]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codex-loops-job-manager
  namespace: codex-loops-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codex-loops-job-manager
subjects:
  - kind: ServiceAccount
    name: codex-loops-controller
    namespace: codex-loops
